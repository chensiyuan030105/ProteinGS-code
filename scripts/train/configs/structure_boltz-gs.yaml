trainer:
  accelerator: gpu
  # accelerator: cpu
  devices: 1
  precision: 32
  gradient_clip_val: 10.0
  max_epochs: -1
  accumulate_grad_batches: 128    # to adjust depending on the number of devices

# Optional set wandb here
wandb:
  name: boltz
  project: boltz
  entity: chensiyuan030105-university-of-british-columbia

output: ./training_output/boltz-gs/
# pretrained: ../../../pretrained_model/boltz1.ckpt
# pretrained: /home/mhg/Projects/Protein-Collision-Free/boltz/training_output/run-20250909_230524-ge8kuq7m/last.ckpt
# pretrained: /home/mhg/Projects/Protein-Collision-Free/boltz/training_output/run-20250910_115517-fak6jpd9/last.ckpt
# pretrained: /home/mhg/Projects/Protein-Collision-Free/boltz/training_output/run-20250910_230245-2ae9dsg7/last.ckpt
# pretrained: /home/mhg/Projects/Protein-Collision-Free/boltz/training_output/run-20250911_090204-hsrca3vz/last.ckpt
# pretrained: /home/mhg/Projects/Protein-Collision-Free/boltz/training_output/run-20250911_131043-6cdm3q82/last.ckpt
# pretrained: /home/mhg/Projects/Protein-Collision-Free/boltz/training_output/run-20250911_223231-xh0n1hdnx/last.ckpt
pretrained: ./supported_data/mol/last.ckpt
# pretrained: null
resume: null
disable_checkpoint: false
matmul_precision: null
save_top_k: -1

data:
  datasets:
    - _target_: boltz.data.module.training.DatasetConfig
      target_dir: ../boltz-training-dataset/rcsb_processed_targets/
      # target_dir: ../boltz-training-dataset-rcsb-7bnh/rcsb_processed_targets/
      msa_dir: ../boltz-training-dataset/rcsb_processed_msa/
      # msa_dir: ../boltz-training-dataset-rcsb-7bnh/rcsb_processed_msa/
      prob: 1.0
      sampler:
        _target_: boltz.data.sample.cluster.ClusterSampler
      cropper:
        _target_: boltz.data.crop.boltz.BoltzCropper
        min_neighborhood: 0
        max_neighborhood: 40
      split: ./scripts/train/assets/small_validation_ids.txt

  filters:
    - _target_: boltz.data.filter.dynamic.size.SizeFilter
      min_chains: 1
      max_chains: 300
    - _target_: boltz.data.filter.dynamic.date.DateFilter
      date: "2021-09-30"
      ref: released
    - _target_: boltz.data.filter.dynamic.resolution.ResolutionFilter
      resolution: 9.0
  
  tokenizer:
    _target_: boltz.data.tokenize.boltz.BoltzTokenizer
  featurizer:
    _target_: boltz.data.feature.featurizer.BoltzFeaturizer

  # symmetries: ../boltz-training-dataset-rcsb-7bnh/symmetry.pkl
  symmetries: ../boltz-training-dataset/symmetry.pkl
  max_tokens: 256 # 256 # default 512
  max_atoms: 2304 # 2304 # default 4608
  max_seqs: 2048                    
  pad_to_max_tokens: true
  pad_to_max_atoms: true
  pad_to_max_seqs: true
  samples_per_epoch: 2100 #0 # default 100000
  batch_size: 1
  num_workers: 4
  random_seed: 42
  pin_memory: true
  overfit: null
  crop_validation: false
  return_train_symmetries: false
  return_val_symmetries: true
  train_binder_pocket_conditioned_prop: 0.3
  val_binder_pocket_conditioned_prop: 0.3
  binder_pocket_cutoff: 6.0
  binder_pocket_sampling_geometric_p: 0.3
  min_dist: 2.0
  max_dist: 22.0
  num_bins: 64
  atoms_per_window_queries: 32
  compute_constraint_features: true

model:
  _target_: boltz.model.models.boltz1.Boltz1
  atom_s: 128
  atom_z: 16
  token_s: 384
  token_z: 128
  num_bins: 64
  atom_feature_dim: 389
  atoms_per_window_queries: 32
  atoms_per_window_keys: 128
  compile_pairformer: false
  nucleotide_rmsd_weight: 5.0
  ligand_rmsd_weight: 10.0
  ema: true
  ema_decay: 0.999

  embedder_args:
    atom_encoder_depth: 3
    atom_encoder_heads: 4

  msa_args:
    msa_s: 64
    msa_blocks: 4
    msa_dropout: 0.15
    z_dropout: 0.25
    pairwise_head_width: 32
    pairwise_num_heads: 4
    activation_checkpointing: true
    offload_to_cpu: false

  pairformer_args:
    num_blocks: 48
    num_heads: 16
    dropout: 0.25
    activation_checkpointing: true
    offload_to_cpu: false

  score_model_args:
    sigma_data: 16
    dim_fourier: 256
    atom_encoder_depth: 3
    atom_encoder_heads: 4
    token_transformer_depth: 24
    token_transformer_heads: 16
    atom_decoder_depth: 3
    atom_decoder_heads: 4
    conditioning_transition_layers: 2
    activation_checkpointing: true
    offload_to_cpu: false

  structure_prediction_training: true
  confidence_prediction: false
  physically_informed: true
  enable_pbd: true
  pretrained_path: ./supported_data/mol/boltz1.ckpt
  enable_gradient: false
  confidence_model_args:
    num_dist_bins: 64
    max_dist: 22
    add_s_to_z_prod: true
    add_s_input_to_s: true
    use_s_diffusion: true
    add_z_input_to_z: true

    confidence_args:
      num_plddt_bins: 50
      num_pde_bins: 64
      num_pae_bins: 64

  training_args:
    recycling_steps: 3
    sampling_steps: 1
    diffusion_multiplicity: 16
    diffusion_samples: 2
    confidence_loss_weight: 1e-4
    diffusion_loss_weight: 4.0
    distogram_loss_weight: 3e-2
    # distogram_loss_weight: 1e-4
    adam_beta_1: 0.9
    adam_beta_2: 0.95
    adam_eps: 0.00000001
    lr_scheduler: af3
    base_lr: 0.00001
    max_lr: 0.00001
    lr_warmup_no_steps: 200
    lr_start_decay_after_n_steps: 50000
    lr_decay_every_n_steps: 50000
    lr_decay_factor: 0.95

  validation_args:
    recycling_steps: 3
    sampling_steps: 1
    diffusion_samples: 5
    symmetry_correction: true
    run_confidence_sequentially: false

  diffusion_process_args:
    sigma_min: 0.0004
    sigma_max: 160.0
    sigma_data: 16.0
    rho: 7
    P_mean: -1.2
    P_std: 1.5
    gamma_0: 0.0
    gamma_min: 1.0
    noise_scale: 1.0
    step_scale: 1.0
    coordinate_augmentation: true
    alignment_reverse_diff: true
    synchronize_sigmas: true
    use_inference_model_cache: true

  diffusion_loss_args:
    add_smooth_lddt_loss: true
    nucleotide_loss_weight: 5.0
    ligand_loss_weight: 10.0

  steering_args:
    fk_steering: False
    num_particles: 3
    fk_lambda: 4.0
    fk_resampling_interval: 3
    # physical_guidance_update: False
    physical_guidance_update: True
    num_gd_steps: 6 # 16 