model: boltz2

# Logical dataset name
dataset: AF3_AB

# Directories are templates that depend on `dataset`
input_dir: "./dataset/input/boltz/AF3_AB"
output_dir: "./output/boltz-2/AF3_AB_TOKEN"

diffusion_samples: 5
seeds: [101]

gpus: [2]
num_gpus: 1

use_potentials: True
cache: "./pretrained_model"  # Path to the cache directory
checkpoint: false

gamma_0: 0.8
noise_scale: 1.003
step_scale: 1.5
sampling_steps: 200

# pdb_id_list: "./evaluation/aggregate_input/AF3_AB/pdb_id_list.txt"
